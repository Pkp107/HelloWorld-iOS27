name: Build iOS 27 IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    # GitHub's Xcode 27 preview image provides the iOS 27 SDK.
    runs-on: xcode-27
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode with iOS 27 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_path="$(xcrun --sdk iphoneos --show-sdk-path)"
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "Using ${sdk_path} (iOS SDK ${sdk_version})"
          if [[ "${sdk_version}" != 27.* ]]; then
            echo "This runner does not have an iOS 27 SDK. Choose a GitHub macOS image/Xcode version that provides it." >&2
            xcodebuild -showsdks
            exit 1
          fi

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project HelloWorld.xcodeproj \
            -scheme HelloWorld \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HelloWorld.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/HelloWorld.xcarchive/Products/Applications/HelloWorld.app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$app_path" "$RUNNER_TEMP/ipa/Payload/HelloWorld.app"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/HelloWorld-iOS27-unsigned.ipa" Payload)

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HelloWorld-iOS27-unsigned-ipa
          path: HelloWorld-iOS27-unsigned.ipa

  livecontainer-build:
    name: Build Workspace with LiveContainer runtime
    runs-on: xcode-27
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode with iOS 27 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "Using iOS SDK ${sdk_version}"
          if [[ "${sdk_version}" != 27.* ]]; then
            xcodebuild -showsdks
            exit 1
          fi

      - name: Prepare pinned LiveContainer source
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          source_root="$(bash scripts/prepare-livecontainer.sh)"
          echo "source_root=${source_root}" >> "$GITHUB_OUTPUT"

      - name: Build integrated unsigned archive
        shell: bash
        env:
          SOURCE_ROOT: ${{ steps.prepare.outputs.source_root }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$SOURCE_ROOT/LiveContainer.xcodeproj" \
            -scheme LiveContainer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/WorkspaceLiveContainer.xcarchive" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=LIVE_CONTAINER_NATIVE \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package integrated unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/WorkspaceLiveContainer.xcarchive/Products/Applications/LiveContainer.app"
          test -d "$app_path"
          mkdir -p "$RUNNER_TEMP/workspace-ipa/Payload"
          cp -R "$app_path" "$RUNNER_TEMP/workspace-ipa/Payload/Workspace.app"
          (cd "$RUNNER_TEMP/workspace-ipa" && zip -qry "$GITHUB_WORKSPACE/Workspace-iOS27-livecontainer-unsigned.ipa" Payload)

      - name: Upload integrated IPA
        uses: actions/upload-artifact@v4
        with:
          name: Workspace-iOS27-livecontainer-unsigned-ipa
          path: Workspace-iOS27-livecontainer-unsigned.ipa

  simulator-build:
    runs-on: xcode-27
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select an available iOS 27 simulator
        shell: bash
        run: |
          set -euo pipefail
          sim_udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); matches=[d for runtime,devices in data["devices"].items() if "iOS-27" in runtime for d in devices if d.get("isAvailable")]; print(matches[0]["udid"] if matches else "")')
          if [[ -z "$sim_udid" ]]; then
            echo "No available iOS 27 simulator was found." >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIM_UDID=$sim_udid" >> "$GITHUB_ENV"
          echo "Using simulator $sim_udid"

      - name: Build for the simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -project HelloWorld.xcodeproj \
            -scheme HelloWorld \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: HelloWorld-iOS27-simulator-build
          path: ${{ runner.temp }}/DerivedData/Build/Products/Debug-iphonesimulator/HelloWorld.app
          if-no-files-found: error
