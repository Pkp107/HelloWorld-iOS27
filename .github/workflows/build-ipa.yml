name: Build iOS 27 IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    # GitHub's Xcode 27 preview image provides the iOS 27 SDK.
    runs-on: xcode-27
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode with iOS 27 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_path="$(xcrun --sdk iphoneos --show-sdk-path)"
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "Using ${sdk_path} (iOS SDK ${sdk_version})"
          if [[ "${sdk_version}" != 27.* ]]; then
            echo "This runner does not have an iOS 27 SDK. Choose a GitHub macOS image/Xcode version that provides it." >&2
            xcodebuild -showsdks
            exit 1
          fi

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project HelloWorld.xcodeproj \
            -scheme HelloWorld \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HelloWorld.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/HelloWorld.xcarchive/Products/Applications/HelloWorld.app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$app_path" "$RUNNER_TEMP/ipa/Payload/HelloWorld.app"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/HelloWorld-iOS27-unsigned.ipa" Payload)

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HelloWorld-iOS27-unsigned-ipa
          path: HelloWorld-iOS27-unsigned.ipa

  simulator:
    runs-on: xcode-27
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select an available iOS 27 simulator
        shell: bash
        run: |
          set -euo pipefail
          sim_udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); matches=[d for runtime,devices in data["devices"].items() if "iOS-27" in runtime for d in devices if d.get("isAvailable")]; print(matches[0]["udid"] if matches else "")')
          if [[ -z "$sim_udid" ]]; then
            echo "No available iOS 27 simulator was found." >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIM_UDID=$sim_udid" >> "$GITHUB_ENV"
          echo "Using simulator $sim_udid"

      - name: Build for the simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -project HelloWorld.xcodeproj \
            -scheme HelloWorld \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Launch app and capture screenshot
        shell: bash
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/HelloWorld.app"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import time

          udid = os.environ["SIM_UDID"]
          app_path = os.environ["RUNNER_TEMP"] + "/DerivedData/Build/Products/Debug-iphonesimulator/HelloWorld.app"
          screenshot_path = os.environ["GITHUB_WORKSPACE"] + "/HelloWorld-iOS27-simulator.png"

          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          state = next(device["state"] for devices_for_runtime in devices["devices"].values() for device in devices_for_runtime if device["udid"] == udid)
          if state != "Booted":
              subprocess.run(["xcrun", "simctl", "boot", udid], check=True, timeout=45)
          subprocess.run(["xcrun", "simctl", "bootstatus", udid, "-b"], check=True, timeout=120)
          subprocess.run(["xcrun", "simctl", "install", udid, app_path], check=True, timeout=60)
          subprocess.run(["xcrun", "simctl", "launch", udid, "com.example.helloworld"], check=True, timeout=30)
          time.sleep(5)
          subprocess.run(["xcrun", "simctl", "io", udid, "screenshot", screenshot_path], check=True, timeout=30)
          PY

      - name: Upload simulator screenshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HelloWorld-iOS27-simulator-screenshot
          path: HelloWorld-iOS27-simulator.png
          if-no-files-found: error
